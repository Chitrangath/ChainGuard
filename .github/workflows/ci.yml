name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint
        env:
          ESLINT_NO_DEV_ERRORS: "true"

      - run: npm run typecheck

      - run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chainguard_test?schema=public"

      - run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chainguard_test?schema=public"
          REDIS_URL: "redis://localhost:6379"

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chainguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chainguard_test?schema=public"

      - name: Build analyzer image
        run: docker build -t chainguard-analyzer:latest -f docker/analyzer/Dockerfile .

      - name: Run tests with Redis
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chainguard_test?schema=public"
          REDIS_URL: "redis://localhost:6379"

      - name: Run real analyzer regression flows
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/chainguard_test?schema=public"
          REDIS_URL: "redis://localhost:6379"
        run: |
          set -euo pipefail
          npm run dev > /tmp/chainguard-ci-app.log 2>&1 &
          app_pid=$!
          npm run worker > /tmp/chainguard-ci-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$app_pid" "$worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:3000 >/dev/null && break
            sleep 2
          done
          RUN_REAL_ANALYZER=1 npx vitest run worker/__tests__/real-analyzer.integration.test.ts
          RUN_DB_INTEGRATION=1 npx vitest run src/lib/__tests__/analysis-queue.integration.test.ts
          E2E_MODE=fixture E2E_TEST_REPO_URL=https://github.com/Chitrangath/ChainGuard bash scripts/e2e-test.sh
          E2E_MODE=terralink E2E_TEST_REPO_URL=https://github.com/Chitrangath/TerraLink-RealEstate-Using-Blockchain bash scripts/e2e-test.sh
          E2E_MODE=no-contract E2E_TEST_REPO_URL=https://github.com/octocat/Hello-World bash scripts/e2e-test.sh
